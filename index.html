<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serpientes y Escaleras</title>
<script>
(function () {
  // Router: phones get the mobile build, everything else the PC build.
  // Invite links (?room=XXXX) are preserved across the redirect.
  var q = window.location.search || '';
  var ua = navigator.userAgent || '';
  var isMobile = /Mobi|Android|iPhone|iPod|Mobile/i.test(ua);
  var target = isMobile
    ? 'serpientes_y_escaleras_mobile.html'
    : 'serpientes_y_escaleras_craft.html';
  window.location.replace(target + q);
})();
</script>
</head>
<body></body>
</html>
